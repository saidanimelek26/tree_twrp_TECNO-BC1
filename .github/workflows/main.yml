name: TWRP BC1

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Parallel jobs for mka
        required: true
        default: "4"
      swap_gb:
        description: Swap file size in GB
        required: true
        default: "8"
      branch:
        description: TWRP manifest branch
        required: true
        default: twrp-10.0
  push:
    branches: [ main, master ]
    paths:
      - "device/**"
      - ".github/workflows/build-recovery.yml"

concurrency:
  group: twrp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: Build recovery.img
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      ANDROID_ROOT: ${{ github.workspace }}/android
      TREE: ${{ github.workspace }}/tree
      DEVICE: BC1
      DEVICE_DIR: device/tecno/BC1
      MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git
      BRANCH: ${{ github.event.inputs.branch || 'twrp-10.0' }}
      JOBS: ${{ github.event.inputs.jobs || '4' }}
      SWAP_GB: ${{ github.event.inputs.swap_gb || '8' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_EXEC: /usr/bin/ccache
      USE_CCACHE: "1"

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: tree
          fetch-depth: 1

      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/az \
                      /opt/pipx /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL /usr/lib/jvm
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev openjdk-8-jdk python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version
          java -version

      - name: Add swap file and zram
        run: |
          sudo swapoff -a || true
          sudo fallocate -l "${SWAP_GB}G" /swapfile \
            || sudo dd if=/dev/zero of=/swapfile bs=1M count=$((SWAP_GB * 1024)) status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo modprobe zram || true
          if [ -e /sys/block/zram0/disksize ]; then
            echo 4G | sudo tee /sys/block/zram0/disksize > /dev/null
            sudo mkswap /dev/zram0 || true
            sudo swapon -p 100 /dev/zram0 || true
          fi
          sudo sysctl -w vm.swappiness=80
          free -h
          swapon --show
          nproc

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.DEVICE }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.DEVICE }}-
            ccache-

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global color.ui false

      - name: Repo init and sync
        run: |
          mkdir -p "$ANDROID_ROOT"
          cd "$ANDROID_ROOT"
          repo init -u "$MANIFEST_URL" -b "$BRANCH" --depth=1 --no-clone-bundle
          for attempt in 1 2 3; do
            if repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags; then
              break
            fi
            echo "sync attempt ${attempt} failed, retrying"
            sleep 20
          done
          repo sync -l
          df -h /

      - name: Copy device tree
        run: |
          cd "$ANDROID_ROOT"
          mkdir -p "$DEVICE_DIR"
          if [ -d "$TREE/$DEVICE_DIR" ]; then
            cp -a "$TREE/$DEVICE_DIR/." "$DEVICE_DIR/"
          else
            cp -a "$TREE/." "$DEVICE_DIR/"
            rm -rf "$DEVICE_DIR/.git" "$DEVICE_DIR/.github"
          fi
          find "$DEVICE_DIR" -type f | sort
          test -f "$DEVICE_DIR/BoardConfig.mk"
          test -f "$DEVICE_DIR/prebuilt/kernel"

      - name: Build recovery image
        run: |
          cd "$ANDROID_ROOT"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export CCACHE_COMPRESS=1
          export CCACHE_MAXSIZE=4G
          ccache -M 4G
          ccache -z
          source build/envsetup.sh
          lunch omni_"${DEVICE}"-eng
          mka recoveryimage -j"${JOBS}"
          ccache -s

      - name: Check image size
        run: |
          IMG="$ANDROID_ROOT/out/target/product/${DEVICE}/recovery.img"
          test -f "$IMG"
          ls -l "$IMG"
          sha256sum "$IMG"
          SIZE=$(stat -c%s "$IMG")
          echo "recovery.img = ${SIZE} bytes"
          if [ "$SIZE" -gt 16777216 ]; then
            echo "::error::recovery.img exceeds the 16 MiB partition ($SIZE bytes)"
            exit 1
          fi
          echo "### recovery.img: ${SIZE} / 16777216 bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-BC1-${{ github.run_number }}
          path: ${{ env.ANDROID_ROOT }}/out/target/product/BC1/recovery.img
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: |
            android/out/verbose.log.gz
            android/out/soong.log
            android/out/error.log
          if-no-files-found: ignore
          retention-days: 7
